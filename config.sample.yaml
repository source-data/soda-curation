##########################################################
#  Default Profile — main pipeline template (v3.3+ flat step schema)
#
#  Each AI step: model + prompts only. Provider inferred from model name.
#  See README "Main pipeline YAML shape" and config.dev.yaml for full prompts.
##########################################################
default: &default
  pipeline:
    ##########################################################
    # 1) Extract Figure Legends and Data Availability Sections
    ##########################################################
    extract_sections:
      model: "gpt-4o"
      prompts:
          system: |
            # EXTRACTIVE task: copy contiguous spans from cleaned HTML manuscript input.
            # figure_legends and data_availability must be exact character-for-character
            # substrings of the input. If source is HTML, return HTML — never plain text.
            # Includes verification tool to ensure one-to-one verbatim extraction.
          user: |
            # User prompt template with variables:
            # $expected_figure_count
            # $expected_figure_labels
            # $manuscript_text
            # Reinforces extractive copy-paste (not generation) of HTML substrings.

    ##########################################################
    # 2) Extract Individual Captions
    ##########################################################
    extract_caption_title:
      model: "gpt-4o"
      prompts:
          system: |
            # EXTRACTIVE task: copy figure caption verbatim from HTML input.
            # figure_caption and caption_title must be exact character-for-character
            # substrings. If source is HTML, return HTML — never plain text.
            # Includes verification tool 'verify_caption_extraction'.
            # On failure to match verbatim, return empty strings (no approximation).
          user: |
            # User prompt template with variables:
            # $figure_label
            # $figure_captions
            # Reinforces extractive one-to-one HTML copy.

    extract_panel_sequence:
      model: "gpt-4o"
      prompts:
          system: |
            # System prompt for panel sequence extraction
            # Panel captions must be exact verbatim HTML substrings of the figure caption
            # Includes verification tool 'verify_panel_sequence'
          user: |
            # User prompt template with variables:
            # $figure_label
            # $figure_caption

    ##########################################################
    # 3) Extract Data Sources
    ##########################################################
    extract_data_sources:
      model: "gpt-4o-mini"
      prompts:
          system: |
            # System prompt for data source extraction
          user: |
            # User prompt template with variables:
            # $data_availability

    ##########################################################
    # 4) Assign Panel Source
    ##########################################################
    assign_panel_source:
      model: "gpt-4o"
      prompts:
          system: |
            # System prompt for panel source assignment
            # Note: any caption text in the inputs is HTML-formatted
          user: |
            # User prompt template with variables:
            # $panel_labels
            # $file_list

    ##########################################################
    # 5) Match Caption Panel
    ##########################################################
    match_caption_panel:
      model: "gpt-4o"
      prompts:
          system: |
            # System prompt for matching panel images to captions
            # Caption and panel_caption strings are HTML; copy them exactly, including tags
          user: |
            # User prompt template with variables:
            # $figure_caption
            # $allowed_panel_labels
            # $allowed_panel_catalog_json

    ##########################################################
    # 6) Acceptance guidelines
    # Policy files (edit these, not this YAML block, for journal rules):
    #   src/soda_curation/pipeline/acceptance_guidelines/guidelines/common.md
    #   src/soda_curation/pipeline/acceptance_guidelines/guidelines/embo_reports.md
    #   src/soda_curation/pipeline/acceptance_guidelines/guidelines/the_embo_journal.md
    #   src/soda_curation/pipeline/acceptance_guidelines/guidelines/embo_molecular_medicine.md
    #   src/soda_curation/pipeline/acceptance_guidelines/guidelines/molecular_systems_biology.md
    #   src/soda_curation/pipeline/acceptance_guidelines/guidelines/life_science_alliance.md
    # Variables: $journal_title $journal_key $common_guidelines $journal_guidelines $manuscript_text
    ##########################################################
    check_acceptance_guidelines:
      model: "gpt-4o"
      prompts:
          system: |
            # PLACEHOLDER: instruction wrapper for the acceptance-guidelines report.
            # Journal policy belongs in the guidelines/*.md files, not here.
          user: |
            # $journal_title
            # $journal_key
            # $common_guidelines
            # $journal_guidelines
            # $manuscript_text

    ##########################################################
    # 7) Object Detection (non-AI)
    ##########################################################
    object_detection:
      model_path: "data/models/panel_detection_model_no_labels.pt"
      confidence_threshold: 0.25
      iou_threshold: 0.1
      image_size: 512
      max_detections: 30