# Evaluation configuration file

# Global settings
output_dir: "/app/data/benchmark/"
ground_truth_dir: "/app/data/ground_truth"
manuscript_dir: "/app/data/archives"
prompts_source: "/app/config.dev.yaml"

# Prompt variants to compare, as name: full pipeline config. Each test case runs
# once per variant. "prod" is cached without a variant suffix; other variants
# are cached under their name, so rename the variant (or bump cache.version)
# after editing its file. Omit to run prompts_source only.
# prompt_variants:
#   prod: "/app/config.dev.yaml"
#   my-variant: "/app/path/to/variant.yaml"

# Test selection
enabled_tests:
  # - extract_sections
  - extract_individual_captions
  - assign_panel_source
  - extract_data_availability
  # - match_caption_panel

# Model configurations to test
providers:
  openai:
    models:
      - name: "gpt-6-luna"  # config.dev.yaml caption steps
        temperatures: [1.0]
        top_p: [1.0]
      - name: "gpt-5.6-sol"  # config.dev.yaml non-caption steps
        temperatures: [1.0]
        top_p: [1.0]

# Test run configuration  
test_runs:
  n_runs: 3  # Number of times to run each configuration
  manuscripts: "all"

cache:
  version: "2026-10-29"  # Increment this when making significant changes

# Results configuration
