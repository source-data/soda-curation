# docker-compose.dev.yml
version: '3.8'
services:
  soda:
    build:
      context: .
      dockerfile: Dockerfile.cpu
      args:
        DEPLOYMENT_ENV: dev
      target: development
    environment:
      - DEPLOYMENT_ENV=dev
      - ENVIRONMENT=dev
      - SODA_MMQC_PATH=/app/.venv/src/soda-mmQC
    env_file:
      - .env.dev
    volumes:
      - ./:/app/
      - /app/.venv
    command: tail -f /dev/null